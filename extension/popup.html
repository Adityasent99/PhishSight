<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        width: 320px;
        padding: 16px;
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: #f1f5f9;
      }

      h2 {
        font-size: 18px;
        margin-bottom: 4px;
        color: #38bdf8;
      }

      p.subtitle {
        font-size: 12px;
        color: #94a3b8;
        margin-bottom: 12px;
      }

      input {
        width: 100%;
        padding: 8px;
        border-radius: 6px;
        border: 1px solid #334155;
        background: #1e293b;
        color: #f1f5f9;
        font-size: 13px;
        box-sizing: border-box;
        margin-bottom: 10px;
      }

      button {
        width: 100%;
        padding: 9px;
        background: #38bdf8;
        color: #0f172a;
        border: none;
        border-radius: 6px;
        font-weight: bold;
        cursor: pointer;
        font-size: 14px;
      }

      button:hover {
        background: #7dd3fc;
      }

      #result {
        margin-top: 14px;
        background: #1e293b;
        border-radius: 8px;
        padding: 12px;
        font-size: 13px;
        display: none;
      }

      .score {
        font-size: 28px;
        font-weight: bold;
        text-align: center;
        margin-bottom: 8px;
      }

      .low { color: #4ade80; }
      .moderate { color: #facc15; }
      .high { color: #f87171; }

      .explanation {
        color: #cbd5e1;
        line-height: 1.5;
        margin-bottom: 10px;
      }

      .tags {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }

      .tag {
        padding: 3px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: bold;
      }

      .tag.yes { background: #7f1d1d; color: #fca5a5; }
      .tag.no  { background: #14532d; color: #86efac; }

      #loading {
        text-align: center;
        color: #94a3b8;
        margin-top: 12px;
        display: none;
        font-size: 13px;
      }

      #error {
        color: #f87171;
        margin-top: 10px;
        font-size: 12px;
        display: none;
      }
    </style>
  </head>
  <body>
    <h2>🎣 PhishSight</h2>
    <p class="subtitle">Paste a URL to check if it's suspicious</p>

    <input type="text" id="urlInput" placeholder="https://example.com" />
    <button id="analyzeBtn">Analyze</button>

    <div id="loading">Analyzing...</div>
    <div id="error"></div>
    <div id="result"></div>

    <script src="popup.js"></script>
  </body>
</html>
